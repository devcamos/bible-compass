name: Daily verse reminders

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: daily-verse-reminders
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Dispatch due daily verses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          TOKEN_FILE="$RUNNER_TEMP/bible-compass-oidc.json"
          trap 'rm -f "$TOKEN_FILE"' EXIT
          curl --fail --silent --show-error --max-time 30 --output "$TOKEN_FILE" --config - <<CURL
          url = "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bible-compass-daily-verse"
          header = "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          CURL
          python3 - "$TOKEN_FILE" <<'PY' | curl --fail-with-body --silent --show-error --max-time 290 --config -
          import json, sys
          with open(sys.argv[1]) as source:
              token = json.load(source)["value"]
          print('url = "https://bible-compass-three.vercel.app/api/cron/daily-verse"')
          print('header = "Authorization: Bearer ' + token + '"')
          PY
