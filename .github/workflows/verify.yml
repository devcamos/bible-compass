name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit dependency security
        run: npm audit --audit-level=high
      - run: npm run verify
      - name: Unit and integration tests (coverage >= 90%)
        run: npm run test:coverage
      - name: Smoke test built application
        shell: bash
        run: |
          set -euo pipefail

          npm run start > /tmp/bible-compass.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3003/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          if [ ! -s /tmp/health.json ]; then
            cat /tmp/bible-compass.log
            exit 1
          fi

          cat /tmp/health.json
          node -e 'const fs = require("fs"); const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8")); if (health.ok !== true || health.product !== "bible-compass") process.exit(1)'
          curl --fail --silent --show-error http://127.0.0.1:3003/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/how-to-use > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/feedback > /dev/null
          # Optional feedback services fail closed when CI has no private storage.
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/api/ratings/summary)" = 503
          test "$(curl --silent -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/api/cron/feedback)" = 401
          curl --fail --silent --show-error http://127.0.0.1:3003/proverbs > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/proverbs/words-and-speech > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/proverbs/verses/proverbs-15-1 > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/proverbs/not-a-category)" = 404
          curl --fail --silent --show-error http://127.0.0.1:3003/psalms > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/psalms/trust-and-refuge > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/psalms/trust-and-refuge/verses/psalm-121-7-8 > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/psalms/not-a-category)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/psalms/trust-and-refuge/verses/not-a-verse)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/psalms/justice-and-hope/verses/psalm-23-4)" = 404
          curl --fail --silent --show-error http://127.0.0.1:3003/verse-of-the-day?date=2026-10-16 > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/manifest.webmanifest > /tmp/manifest.json
          node -e 'const m = JSON.parse(require("fs").readFileSync("/tmp/manifest.json")); if (m.display !== "standalone" || m.start_url !== "/" || m.icons.length < 2) process.exit(1)'
          curl --fail --silent --show-error http://127.0.0.1:3003/pwa/icon-192.png > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/pwa/icon-512.png > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/sw.js > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3003/api/cron/daily-verse)" = 401
          curl --fail --silent --show-error http://127.0.0.1:3003/concepts > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3003/concepts/data > /tmp/concepts.json
          node -e 'const fs = require("fs"); const data = JSON.parse(fs.readFileSync("/tmp/concepts.json", "utf8")); const source = JSON.parse(fs.readFileSync("src/content/concepts/ontology.json", "utf8")); if (data.schemaVersion !== source.schemaVersion || JSON.stringify(data.concepts) !== JSON.stringify(source.concepts) || JSON.stringify(data.relations) !== JSON.stringify(source.relations) || !data.lifeAreas.length || !data.topics.length) process.exit(1)'
          node scripts/concept-references-smoke.mjs
          node scripts/prophet-summaries-smoke.mjs

  smoke:
    # Real-browser smoke test on a local production build. Catches what unit
    # tests can't: console errors, CSP blocks, broken hydration, wrong status.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser smoke test
        run: npm run test:smoke
        env:
          CI: "true"
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  production-proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prove production serves the exact main commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PROD_HEALTH_URL: https://bible-compass-three.vercel.app/health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            BODY="$(curl --fail --silent --show-error "$PROD_HEALTH_URL" || true)"

            if [ -n "$BODY" ]; then
              echo "Production health: $BODY"

              if HEALTH_BODY="$BODY" node -e 'const health = JSON.parse(process.env.HEALTH_BODY); process.exit(health.ok === true && health.product === "bible-compass" && health.commit === process.env.EXPECTED_SHA ? 0 : 1)'; then
                echo "Production is serving expected commit $EXPECTED_SHA"
                exit 0
              fi
            fi

            sleep 10
          done

          echo "Production did not serve expected commit $EXPECTED_SHA within the release window."
          exit 1
