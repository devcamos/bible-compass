version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch updates arrive together in one PR. Majors are left out of
    # the group on purpose, so Dependabot opens each major as its own PR and a
    # breakage points at exactly one upgrade.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Runtime is Node 24 (engines.node, .nvmrc, Vercel). Keep types on the
      # same major; bump this together with the runtime, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16's bundled plugins (react, import, jsx-a11y) only
      # declare support for ESLint <=9. Revisit when they add ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (used by eslint-config-next) supports TypeScript <6.1.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
